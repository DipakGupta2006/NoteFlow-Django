<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - NoteFlow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f23, #1a1a3e);
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 6%;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        nav a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        nav a:hover { color: white; }

        .auth-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 16px;
            padding: 36px 32px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .card h2 {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .card p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #6c63ff;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover { background: #574fd6; }
    </style>
</head>
<body>

    <header>
        <a href="{% url 'landing' %}" class="logo">📝 NoteFlow</a>
        <nav>
            <a href="{% url 'login' %}">Sign In</a>
            <a href="{% url 'register' %}">Register</a>
        </nav>
    </header>

    <section class="auth-section">
        <div class="card">
            <div class="icon">✅</div>
            <h2>Password Reset Complete</h2>
            <p>Your password has been set successfully. You can now log in with your new password.</p>
            <a href="{% url 'login' %}" class="btn">Log In →</a>
        </div>
    </section>

</body>
</html>
