<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - NoteFlow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f23, #1a1a3e);
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 6%;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo { font-size: 20px; font-weight: 700; color: white; text-decoration: none; }

        nav a { color: #94a3b8; text-decoration: none; margin-left: 20px; font-size: 14px; }
        nav a:hover { color: white; }

        .auth-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 16px;
            padding: 36px 32px;
            width: 100%;
            max-width: 420px;
        }

        .card h2 { color: white; font-size: 1.5rem; margin-bottom: 10px; text-align: center; }

        .card .subtitle { color: #94a3b8; font-size: 0.9rem; text-align: center; margin-bottom: 24px; line-height: 1.6; }

        .card form p { display: flex; flex-direction: column; margin-bottom: 14px; }

        .card form label { color: #94a3b8; font-size: 0.85rem; margin-bottom: 6px; }

        .card form input {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.07);
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .card form input:focus { border-color: #6c63ff; }

        .errorlist { color: #f64f59; font-size: 0.8rem; list-style: none; margin-top: 4px; }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"]:hover { background: #574fd6; }

        .auth-links { text-align: center; margin-top: 18px; }

        .auth-links a { color: #6c63ff; font-size: 0.88rem; text-decoration: none; }
        .auth-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <a href="{% url 'landing' %}" class="logo">📝 NoteFlow</a>
        <nav>
            <a href="{% url 'login' %}">Sign In</a>
            <a href="{% url 'register' %}">Register</a>
        </nav>
    </header>

    <section class="auth-section">
        <div class="card">
            <h2>Reset Password</h2>
            <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Send Reset Link →</button>
            </form>
            <div class="auth-links">
                <a href="{% url 'login' %}">Back to Login</a>
            </div>
        </div>
    </section>

</body>
</html>
