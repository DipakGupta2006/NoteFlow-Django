<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NoteFlow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f23, #1a1a3e);
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 6%;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo { font-size: 20px; font-weight: 700; color: white; text-decoration: none; }

        nav a { color: #94a3b8; text-decoration: none; margin-left: 20px; font-size: 14px; }
        nav a:hover { color: white; }

        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 16px;
            padding: 40px 32px;
            width: 100%;
            max-width: 460px;
            text-align: center;
        }

        .icon { font-size: 3rem; margin-bottom: 16px; }

        .card h2 { color: white; font-size: 1.5rem; margin-bottom: 10px; }

        .card p { color: #94a3b8; font-size: 0.93rem; margin-bottom: 6px; }

        .email {
            display: inline-block;
            margin: 16px 0 28px;
            padding: 8px 18px;
            background: rgba(108,99,255,0.12);
            border: 1px solid rgba(108,99,255,0.25);
            border-radius: 8px;
            color: #a78bfa;
            font-size: 0.9rem;
        }

        .btn-logout {
            display: inline-block;
            padding: 12px 32px;
            background: #f64f59;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-logout:hover { background: #d93f48; }
    </style>
</head>
<body>

    <header>
        <a href="{% url 'landing' %}" class="logo">📝 NoteFlow</a>
        <nav>
            <a href="{% url 'notes:note_create' %}">Create Note</a>
            <a href="{% url 'notes:note_list' %}">View All Notes</a>
            <a href="{% url 'notes:note_archive_list' %}">Archived</a>
            <a href="{% url 'logout' %}">Logout</a>
        </nav>
    </header>

    <section class="main">
        <div class="card">
            <div class="icon">👋</div>
            <h2>Welcome, {{ user.username }}!</h2>
            <p>Your registered email</p>
            <span class="email">{{ user.email }}</span>
            <br>
            <a href="{% url 'logout' %}" class="btn-logout">Logout →</a>
        </div>
    </section>

</body>
</html>
