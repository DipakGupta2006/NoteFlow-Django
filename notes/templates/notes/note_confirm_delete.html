<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Note - NoteFlow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f23, #1a1a3e);
            display: flex;
            flex-direction: column;
            color: white;
        }

        /* Common Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 6%;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo { font-size: 20px; font-weight: 700; color: white; text-decoration: none; }
        
        nav a { color: #94a3b8; text-decoration: none; margin-left: 20px; font-size: 14px; }
        nav a:hover { color: white; }

        /* Centered Container for Delete Card */
        .main { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }

        /* Delete Confirmation Card */
        .delete-card {
            background: rgba(255,255,255,0.05);
            /* Red tinted border to indicate danger */
            border: 1px solid rgba(246,79,89,0.4); 
            border-radius: 14px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(246,79,89,0.1);
        }

        .delete-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        .delete-card h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #f87171;
        }

        .note-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0,0,0,0.25);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .warning-text {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        /* Action Buttons */
        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-cancel {
            background: rgba(255,255,255,0.1);
            color: #cbd5e1;
        }
        .btn-cancel:hover {
            background: rgba(255,255,255,0.2);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <a href="{% url 'home' %}" class="logo">📝 NoteFlow</a>
        <nav>
            <a href="{% url 'notes:note_create' %}">Create Note</a>
            <a href="{% url 'notes:note_list' %}">View All Notes</a>
            <a href="{% url 'logout' %}">Logout</a>
        </nav>
    </header>

    <section class="main">
        <div class="delete-card">
            <div class="delete-icon">🗑️</div>
            <h2>Delete Note?</h2>
            
            <p style="color: #cbd5e1;">Are you sure you want to delete this note?</p>
            
            <div class="note-title">
                "{{ note.title }}"
            </div>
            
            <p class="warning-text">This action cannot be undone!</p>

            <form method="POST">
                {% csrf_token %}
                <div class="actions">
                    <button type="submit" class="btn btn-danger">Yes, Delete It</button>
                    <a href="{% url 'notes:note_detail' note.pk %}" class="btn btn-cancel">Cancel</a>
                </div>
            </form>
        </div>
    </section>

</body>
</html>
